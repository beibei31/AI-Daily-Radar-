name: Daily AI Radar

on:
  workflow_dispatch:
  schedule:
    - cron: "30 0 * * *"
    # Temporary trigger probe: 2026-09-07 11:07 Asia/Shanghai. Remove after observation.
    - cron: "7 3 7 9 *"

jobs:
  schedule-probe:
    if: github.event_name == 'schedule' && github.event.schedule == '7 3 7 9 *'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Record automatic scheduler delivery
        env:
          TRIGGER: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ "$(date -u +%F)" != "2026-09-07" ]; then
            echo "Temporary probe expired; no pipeline will run."
            exit 0
          fi
          {
            echo "## Automatic schedule probe"
            echo "Event: $TRIGGER"
            echo "Schedule (UTC): $SCHEDULE"
            echo "Observed at (UTC): $(date -u +%FT%TZ)"
            echo "Commit: $GITHUB_SHA"
            echo "Scheduler only: no LLM calls, secrets or database access."
          } | tee -a "$GITHUB_STEP_SUMMARY"

  daily-radar:
    if: github.event_name != 'schedule' || github.event.schedule == '30 0 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run pipeline
        run: npm run pipeline
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_API_BASE_URL: ${{ secrets.LLM_API_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
